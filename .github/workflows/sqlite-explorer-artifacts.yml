name: SQLite Explorer artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unix:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-macos
            runner: macos-15
          - target: x86_64-macos
            runner: macos-15-intel
          - target: x86_64-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev
      - name: Build
        # BUILD_WITH_STRIP / BUILD_WITH_GC_SECTIONS are read from the
        # environment by the xoption() macro at configure time. Strip removes
        # the symbol table and (on Linux) in-binary DWARF after linking;
        # GC_SECTIONS compiles with -ffunction-sections/-fdata-sections and
        # links with dead-code stripping. Neither changes the feature set,
        # SQLite compile flags, or the Release optimization level.
        run: make TJS_ZIG_TARGET=${{ matrix.target }}
        env:
          BUILD_WITH_STRIP: "ON"
          BUILD_WITH_GC_SECTIONS: "ON"
      - name: Package
        run: |
          mkdir -p artifact
          cp build/tjs artifact/tjs
          ls -l artifact
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: artifact
          if-no-files-found: error

  build-windows:
    name: x86_64-windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'
      - name: Install native dependencies
        run: vcpkg install libffi:x64-windows-static
      - name: Configure
        # GC_SECTIONS maps to /Gy + /OPT:REF /OPT:ICF under MSVC (the Visual
        # Studio release-template defaults). BUILD_WITH_STRIP is intentionally
        # not set here: MSVC has no CMAKE_STRIP, and letting CMake resolve a
        # GNU strip.exe from the runner PATH against an MSVC PE would be worse
        # than shipping the symbol-free MSVC binary as-is.
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static -DTJS_ZIG_TARGET=x86_64-windows-gnu -DBUILD_WITH_GC_SECTIONS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        run: |
          New-Item -ItemType Directory -Path artifact | Out-Null
          Copy-Item build/Release/tjs.exe artifact/tjs.exe
          Get-ChildItem artifact
      - uses: actions/upload-artifact@v7
        with:
          name: x86_64-windows
          path: artifact
          if-no-files-found: error
