name: SQLite Explorer artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unix:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-macos
            runner: macos-15
          - target: x86_64-macos
            runner: macos-15-intel
          # The Linux binaries are compiled and linked inside manylinux_2_28
          # (AlmaLinux 8), so glibc 2.28 is the newest version they can need.
          # Built on the runner itself they picked up the C23 strtol/sscanf
          # variants and fmod@GLIBC_2.38 from Ubuntu 24.04 and did not start
          # on Debian 12, Ubuntu 22.04 or RHEL 8/9. The contract tests below
          # run in the same container, on the floor itself.
          - target: x86_64-linux-gnu
            zig_target: x86_64-linux-gnu.2.28
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - target: aarch64-linux-gnu
            zig_target: aarch64-linux-gnu.2.28
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
    container: ${{ matrix.container || '' }}
    steps:
      - name: Trust the workspace
        # Steps in the container run as root on a workspace the runner owns;
        # the configure step applies dependency patches with git.
        if: matrix.container
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build
        # BUILD_WITH_STRIP / BUILD_WITH_GC_SECTIONS are read from the
        # environment by the xoption() macro at configure time. Strip removes
        # the symbol table and (on Linux) in-binary DWARF after linking;
        # GC_SECTIONS compiles with -ffunction-sections/-fdata-sections and
        # links with dead-code stripping. Neither changes the feature set,
        # SQLite compile flags, or the Release optimization level.
        #
        # WASM / FFI / LWS / Ada / full WebCrypto are excluded: the SQLite Explorer native worker
        # imports only tjs:sqlite and tjs:v8 and talks over stdio, so WAMR,
        # libffi/dlopen and the libwebsockets+mbedTLS(TLS/X.509) stack are
        # dead weight (and attack surface) in this artifact. URL parsing and
        # SubtleCrypto are also unused; OS-backed getRandomValues/randomUUID,
        # mbedcrypto-backed tjs:hashing, SQLite, and the QuickJS core remain.
        run: make TJS_ZIG_TARGET=${{ matrix.zig_target || matrix.target }}
        env:
          # The manylinux toolchain has libatomic and a dependency links it
          # when found, although nothing calls into it on these targets. A
          # NEEDED entry for it stops the binary from starting on systems
          # without that package, so only libraries that resolve a symbol stay.
          LDFLAGS: ${{ runner.os == 'Linux' && '-Wl,--as-needed' || '' }}
          BUILD_WITH_STRIP: "ON"
          BUILD_WITH_GC_SECTIONS: "ON"
          BUILD_WITH_WASM: "OFF"
          BUILD_WITH_FFI: "OFF"
          BUILD_WITH_LWS: "OFF"
          BUILD_WITH_ADA: "OFF"
          BUILD_WITH_WEBCRYPTO: "OFF"
      - name: Check the glibc floor and shared libraries
        if: runner.os == 'Linux'
        run: |
          highest=$(objdump -T build/tjs | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -Vu | tail -n 1)
          echo "Highest glibc symbol version needed: ${highest:-none}"
          test -n "$highest"
          test "$(printf '%s\n' GLIBC_2.28 "$highest" | sort -V | tail -n 1)" = GLIBC_2.28
          needed=$(objdump -p build/tjs | awk '$1 == "NEEDED" { print $2 }' | sort | tr '\n' ' ')
          echo "Shared libraries needed: $needed"
          for library in $needed; do
            case "$library" in
              libc.so.6|libm.so.6|libpthread.so.0|libdl.so.2|librt.so.1|ld-linux-*.so.*) ;;
              *) echo "Unexpected shared library: $library"; exit 1 ;;
            esac
          done
      - name: Verify SQLite and V8 contracts
        timeout-minutes: 2
        run: |
          ./build/tjs run tests/test-sqlite-interrupt.js
          ./build/tjs run tests/test-sqlite-primary-async.js
          ./build/tjs run tests/test-sqlite-attach-authority.js
          ./build/tjs run tests/test-sqlite-text-nul.js
          ./build/tjs run tests/test-sqlite-row-conversion.js
          ./build/tjs run tests/test-sqlite-statement-reuse.js
          ./build/tjs run tests/test-sqlite-error-message.js
          ./build/tjs run tests/test-dispose-database.js
          ./build/tjs run tests/test-dispose-statement.js
          ./build/tjs run tests/test-v8.js
      - name: Package
        run: |
          mkdir -p artifact
          cp build/tjs artifact/tjs
          ls -l artifact
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: artifact
          if-no-files-found: error

  build-windows:
    name: x86_64-windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'
      - name: Install native dependencies
        run: vcpkg install libffi:x64-windows-static
      - name: Configure
        # GC_SECTIONS maps to /Gy + /OPT:REF /OPT:ICF under MSVC (the Visual
        # Studio release-template defaults). BUILD_WITH_STRIP is intentionally
        # not set here: MSVC has no CMAKE_STRIP, and letting CMake resolve a
        # GNU strip.exe from the runner PATH against an MSVC PE would be worse
        # than shipping the symbol-free MSVC binary as-is.
        # WASM/FFI/LWS/Ada/full WebCrypto are excluded for the same reason as
        # the unix jobs. The minimal OS-backed RNG surface remains. vcpkg and
        # the libffi install above are now vestigial (find_package(libffi) only
        # runs under BUILD_WITH_FFI=ON) but are kept until a CI run confirms
        # the trimmed configure on Windows; prune in a follow-up.
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static -DTJS_ZIG_TARGET=x86_64-windows-gnu -DBUILD_WITH_GC_SECTIONS=ON -DBUILD_WITH_WASM=OFF -DBUILD_WITH_FFI=OFF -DBUILD_WITH_LWS=OFF -DBUILD_WITH_ADA=OFF -DBUILD_WITH_WEBCRYPTO=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Verify SQLite and V8 contracts
        timeout-minutes: 2
        run: |
          $runtimeTests = @('test-sqlite-interrupt.js', 'test-sqlite-primary-async.js', 'test-sqlite-attach-authority.js', 'test-sqlite-text-nul.js', 'test-sqlite-row-conversion.js', 'test-sqlite-statement-reuse.js', 'test-sqlite-error-message.js', 'test-dispose-database.js', 'test-dispose-statement.js', 'test-v8.js')
          foreach ($runtimeTest in $runtimeTests) {
            & ./build/Release/tjs.exe run "tests/$runtimeTest"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Package
        run: |
          New-Item -ItemType Directory -Path artifact | Out-Null
          Copy-Item build/Release/tjs.exe artifact/tjs.exe
          Get-ChildItem artifact
      - uses: actions/upload-artifact@v7
        with:
          name: x86_64-windows
          path: artifact
          if-no-files-found: error
